name: Laravel CI

on:
  push:
    branches: [ working-docker ]
  pull_request:
    branches: [ working-docker ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: laravel_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4

      # -----------------------------
      # PHP
      # -----------------------------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.1
          extensions: mbstring, pdo, pdo_mysql, bcmath, intl, pcntl, gd, exif
          coverage: none

      # -----------------------------
      # Guaranteed Composer
      # -----------------------------
      - name: Install Composer
        run: |
          php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
          php composer-setup.php --install-dir=/usr/local/bin --filename=composer
          echo "/usr/local/bin" >> $GITHUB_PATH
          composer --version

      # -----------------------------
      # Laravel setup
      # -----------------------------
      - name: Copy .env 
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install dependencies (force update + install)
        run: |
          # Update composer & rebuild lock (like Dockerfile)
          composer update --no-dev --optimize-autoloader
          composer install --no-dev --no-progress --prefer-dist --optimize-autoloader


      - name: Generate key
        run: php artisan key:generate

      - name: Run migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: laravel_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate --force
