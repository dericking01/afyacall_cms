name: Laravel CI

on:
  push:
    branches: [ working-docker ]
  pull_request:
    branches: [ working-docker ]

# --------------------------------------------------
# STAGE 1: BUILD & SETUP
# --------------------------------------------------
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # -----------------------------
      # PHP
      # -----------------------------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.1
          extensions: mbstring, pdo, pdo_mysql, bcmath, intl, pcntl, gd, exif
          coverage: none

      # -----------------------------
      # Guaranteed Composer
      # -----------------------------
      - name: Install Composer
        run: |
          php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
          php composer-setup.php --install-dir=/usr/local/bin --filename=composer
          echo "/usr/local/bin" >> $GITHUB_PATH
          composer --version

      # -----------------------------
      # Laravel setup
      # -----------------------------
      - name: Copy .env 
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install dependencies (force update + install)
        run: |
          composer update --no-dev --optimize-autoloader
          composer install --no-dev --no-progress --prefer-dist --optimize-autoloader

      - name: Generate key
        run: php artisan key:generate

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: laravel-build
          path: |
            vendor
            .env



# --------------------------------------------------
# STAGE 2: DATABASE & MIGRATIONS
# --------------------------------------------------
  migrate:
    runs-on: ubuntu-latest
    needs: build

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: laravel_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.1
          extensions: mbstring, pdo, pdo_mysql, bcmath, intl, pcntl, gd, exif
          coverage: none

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: laravel-build

      - name: Run migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: laravel_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate --force

  # --------------------------------------------------
  # STAGE 3: DEPLOYMENT
  # --------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: migrate

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 4358
          script: |
            echo "🚀 Connecting to server...."

            cd /root/afyacall || { echo "❌ Project directory not found"; exit 1; }
            echo "✅ Directory exists: $(pwd)"

            echo "⏳ Pulling latest code..."
            git fetch origin working-docker
            git reset --hard origin/working-docker || { echo "❌ Git pull failed"; exit 1; }
            echo "✅ Git updated successfully"

            echo "⏳ Building Docker images..."
            docker compose build || { echo "❌ Docker build failed"; exit 1; }
            echo "✅ Docker build completed"

            echo "⏳ Deploying containers..."
            docker compose up -d || { echo "❌ Docker up failed"; exit 1; }
            echo "✅ Docker containers are running"

            echo "🎉 Deployment succeeded!"
  # --------------------------------------------------
  # STAGE 4: SONARQUBE SCAN
  # --------------------------------------------------
  sonar_scan:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.1
          extensions: mbstring, pdo, pdo_mysql, bcmath, intl, pcntl, gd, exif

      - name: Install Composer
        run: |
          php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
          php composer-setup.php --install-dir=/usr/local/bin --filename=composer
          echo "/usr/local/bin" >> $GITHUB_PATH
          composer --version

      - name: Run SonarQube Scan
        uses: docker://sonarsource/sonar-scanner-cli:latest
        with:
          args: >
            -Dsonar.projectKey=afyacall_cms
            -Dsonar.projectName=AfyaCallCMS
            -Dsonar.projectVersion=1.0
            -Dsonar.sources=.
            -Dsonar.host.url=http://197.250.15.155:9091/
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}
            -Dsonar.branch.name=working-docker
