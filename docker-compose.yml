services:
  # Application service
  afyacall:
    platform: linux/amd64
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    container_name: afyacall-core
    working_dir: /var/www/html
    image: twiga.afyacall.co.tz:5000/afyacall_app:1.0.8
    volumes:
      - vendor_data:/var/www/html/vendor
      - ./:/var/www/html
    environment:
      APP_NAME: AfyaCall
      APP_ENV: local
      APP_DEBUG: false
      APP_URL: https://twiga.afyacall.co.tz
      LOG_CHANNEL: stack
      DB_CONNECTION: mysql
      DB_HOST: 192.168.1.11
      DB_PORT: 3306
      DB_DATABASE: afyacalltestdb
      DB_USERNAME: rm_db
      DB_PASSWORD: AfyPassdb123a*
      BROADCAST_DRIVER: log
      CACHE_DRIVER: file
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
      SESSION_LIFETIME: 30
    networks:
      - afyacall_core_network

  # Nginx service with SSL
  nginx:
    platform: linux/amd64
    image: twiga.afyacall.co.tz:5000/afycall_core_nginx
    build:
      context: .
      dockerfile: ./docker/nginx/Dockerfile
    container_name: core_nginx
    ports:
      - "5443:443"   # SSL port
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/certs/twiga.afyacall.co.tz.crt:/etc/nginx/ssl/twiga.afyacall.co.tz.crt
      - ./docker/certs/twiga.afyacall.co.tz.key:/etc/nginx/ssl/twiga.afyacall.co.tz.key
      - ./logs/access.log:/var/log/access_log
    depends_on:
      - afyacall
    networks:
      - afyacall_core_network

networks:
  afyacall_core_network:
    driver: bridge

volumes:
  vendor_data:
