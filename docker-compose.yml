services:
  laravel:
    build:
      context: .
    container_name: afyacall_app
    volumes:
      - .:/var/www
    networks:
      - afyacall_net
    environment:
      DB_CONNECTION: '${DB_CONNECTION}'
      DB_HOST: '${DB_HOST}'
      DB_PORT: '${DB_PORT:-3306}:3306'
      DB_DATABASE: '${DB_DATABASE}'
      DB_USERNAME: '${DB_USERNAME}'
      DB_PASSWORD: '${DB_PASSWORD}'
    depends_on:
      - nginx

  nginx:
    image: nginx:alpine
    container_name: afyacall_nginx
    ports:
      - '${APP_PORT:-8000}:80'
    volumes:
      - .:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - afyacall_net

networks:
  afyacall_net:
    driver: bridge
