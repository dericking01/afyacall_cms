services:
  # Application service
  afyacall:
    platform: linux/amd64
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    container_name: afyacall-core
    working_dir: /var/www/html
    image: localhost:5000/afyacall_app:1.0.88
    volumes:
      - vendor_data:/var/www/html/vendor
      - ./:/var/www/html
    environment:
      APP_NAME: ${APP_NAME:-AfyaCall}
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-https://twiga.afyacall.co.tz}
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-192.168.1.11}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-afyacallproduction}
      DB_USERNAME: ${DB_USERNAME:-derrickdb}
      DB_PASSWORD: ${DB_PASSWORD}
      BROADCAST_DRIVER: ${BROADCAST_DRIVER:-log}
      CACHE_DRIVER: ${CACHE_DRIVER:-file}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-sync}
      SESSION_DRIVER: ${SESSION_DRIVER:-file}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-30}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_PORT: ${REDIS_PORT:-6380}
    networks:
      - afyacall_core_network

  # Nginx service with SSL
  nginx:
    platform: linux/amd64
    image: localhost:5000/afycall_core_nginx
    build:
      context: .
      dockerfile: ./docker/nginx/Dockerfile
    container_name: core_nginx
    ports:
      - "5443:443"   # SSL port
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/certs/twiga.afyacall.co.tz.crt:/etc/nginx/ssl/twiga.afyacall.co.tz.crt
      - ./docker/certs/twiga.afyacall.co.tz.key:/etc/nginx/ssl/twiga.afyacall.co.tz.key
      - ./logs/access.log:/var/log/access_log
    depends_on:
      - afyacall
    networks:
      - afyacall_core_network

# Redis service
  redis:
    image: redis:latest
    container_name: afyacall_redis
    ports:
      - "6380:6379"  # Expose Redis port
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data  # Persist Redis data
    networks:
      - afyacall_core_network

networks:
  afyacall_core_network:
    external: true

volumes:
  vendor_data:
  redis_data: