[www]

user = www-data
group = www-data

listen = 9000
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 128         ; 2x cores, depending on memory
pm.start_servers = 16
pm.min_spare_servers = 8
pm.max_spare_servers = 32

pm.max_requests = 1000        ; Restart workers after 1000 requests
request_terminate_timeout = 300
request_slowlog_timeout = 5s
slowlog = /var/log/php-fpm/slowlog.log

php_admin_value[error_log] = /var/log/php-fpm/error.log
php_admin_flag[log_errors] = on
php_admin_value[session.save_path] = /var/lib/php/sessions
php_admin_value[upload_tmp_dir] = /var/lib/php/uploads
php_admin_value[opcache.file_cache] = /var/lib/php/opcache
php_admin_value[opcache.memory_consumption] = 128
php_admin_value[opcache.interned_strings_buffer] = 8
php_admin_value[opcache.max_accelerated_files] = 10000
php_admin_value[opcache.validate_timestamps] = 1
php_admin_value[opcache.revalidate_freq] = 2
php_admin_value[opcache.fast_shutdown] = 1
php_admin_value[opcache.enable] = 1         ; Enable OPcache
php_admin_value[opcache.enable_cli] = 1    ; Enable OPcache for CLI         